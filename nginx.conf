# ==============================================================================
# KICCPA.COM - NGINX PRODUCTION CONFIG
# Domain: kiccpa.com
# Location on VPS: /etc/nginx/sites-available/kiccpa.conf
#
# Services:
#   - Next.js Frontend (SSR)  → 127.0.0.1:3010
#   - Express Backend API     → 127.0.0.1:5010
# ==============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name kiccpa.com www.kiccpa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kiccpa.com www.kiccpa.com;

    # SSL Certificate (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/kiccpa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiccpa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # 1. Backend REST API → Port 5010
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 2. Backend-served uploads (documents, files)
    # ─────────────────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5010/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 3. Next.js Frontend (SSR + ISR) → Port 3010
    #    NextAuth callbacks, Sanity Studio (/studio), all pages
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
